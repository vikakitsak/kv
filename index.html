<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Графік Прибирань</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
    }
    th, td {
      border: 1px solid #999;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #eee;
    }
  </style>
</head>
<body>
  <h2>Графік Прибирань (3 травня – 2 липня)</h2>
  <table id="schedule">
    <thead>
      <tr>
        <th>Дата</th>
        <th>Кімната</th>
        <th>Прибрано</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const startDate = new Date("2025-05-03");
    const daysToGenerate = 60; // приблизно 2 місяці
    const tableBody = document.querySelector("#schedule tbody");

    for (let i = 0; i < daysToGenerate; i += 2) {
      const date = new Date(startDate);
      date.setDate(date.getDate() + i);
      const dateStr = date.toISOString().split('T')[0];

      const room = (i / 2) % 2 === 0 ? "Кімната 2" : "Кімната 1";
      const checkboxId = `chk-${dateStr}`;

      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${date.toLocaleDateString('uk-UA')}</td>
        <td>${room}</td>
        <td><input type="checkbox" id="${checkboxId}"></td>
      `;

      tableBody.appendChild(row);

      const checkbox = row.querySelector("input[type='checkbox']");
      // Відновлення з localStorage
      checkbox.checked = localStorage.getItem(checkboxId) === "true";

      // Збереження в localStorage при зміні
      checkbox.addEventListener("change", () => {
        localStorage.setItem(checkboxId, checkbox.checked);
      });
    }
  </script>
</body>
</html>
