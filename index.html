<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Графік прибирання (травень 2025)</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #e0e0e0;
    }
  </style>
</head>
<body>
  <h1>Графік прибирання (травень 2025)</h1>
  <table>
    <thead>
      <tr>
        <th>Дата</th>
        <th>Черга кімнати</th>
        <th>Позначено виконаним</th>
      </tr>
    </thead>
    <tbody id="schedule-table"></tbody>
  </table>

  <script>
    const schedule = [
      ["3 травня", "2 кім."],
      ["5 травня", "1 кім."],
      ["7 травня", "2 кім."],
      ["9 травня", "1 кім."],
      ["11 травня", "2 кім."],
      ["13 травня", "1 кім."],
      ["15 травня", "2 кім."],
      ["17 травня", "1 кім."],
      ["19 травня", "2 кім."],
      ["21 травня", "1 кім."],
      ["23 травня", "2 кім."],
      ["25 травня", "1 кім."],
      ["27 травня", "2 кім."],
      ["29 травня", "1 кім."],
      ["31 травня", "2 кім."]
    ];

    const tableBody = document.getElementById("schedule-table");

    schedule.forEach(([date, room], index) => {
      const tr = document.createElement("tr");

      const dateTd = document.createElement("td");
      dateTd.textContent = date;

      const roomTd = document.createElement("td");
      roomTd.textContent = room;

      const checkTd = document.createElement("td");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";

      const key = `cleaning_done_${index}`;
      checkbox.checked = localStorage.getItem(key) === "true";

      checkbox.addEventListener("change", () => {
        localStorage.setItem(key, checkbox.checked);
      });

      checkTd.appendChild(checkbox);
      tr.appendChild(dateTd);
      tr.appendChild(roomTd);
      tr.appendChild(checkTd);
      tableBody.appendChild(tr);
    });
  </script>
</body>
</html>
